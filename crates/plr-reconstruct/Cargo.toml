[package]
name = "plr-reconstruct"
description = "Printer state reconstruction from a recovered write-ahead log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plr-gcode = { path = "../plr-gcode" }
plr-klipper = { path = "../plr-klipper" }
plr-wal = { path = "../plr-wal" }
# float_roundtrip, for the same reason plr-wal enables it: object
# outlines parsed out of `EXCLUDE_OBJECT_DEFINE POLYGON=` decide
# geometry, and a coordinate that shifts by an ULP on parse would
# silently disagree with the same value journaled through the WAL.
# Workspace feature unification already supplies it in this tree;
# naming it here keeps a standalone build of this crate correct.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
