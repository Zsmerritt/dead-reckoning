[package]
name = "plrd"
description = "The dead-reckoning daemon: Linux-only runtime for durable WAL I/O and Klipper integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plr-analyzer = { path = "../plr-analyzer" }
plr-gcode = { path = "../plr-gcode" }
plr-klipper = { path = "../plr-klipper" }
plr-reconstruct = { path = "../plr-reconstruct" }
plr-recovery = { path = "../plr-recovery" }
plr-wal = { path = "../plr-wal" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Moonraker WebSocket JSON-RPC client (src/moonraker.rs).
tokio-tungstenite = { workspace = true }
# Stream/Sink traits for the WebSocket (see the workspace table note).
futures-util = { workspace = true }

# Durability syscalls (fdatasync, O_DSYNC) are Linux-only by design and are
# never mocked; keep rustix off non-Linux builds entirely. The `time`
# feature adds CLOCK_MONOTONIC access (`clock_gettime`), needed so record
# timestamps share a clock domain with Klipper's reactor `eventtime`
# (which is `time.monotonic()`); this is a feature of an existing
# workspace dependency, not a new dependency.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["time"] }
# Power-failing GPIO watcher (src/powerfail.rs). `gpiocdev` is a pure-Rust
# client for the Linux GPIO character-device uABI (cdev v2) — it talks to
# `/dev/gpiochipN` via ioctls directly, with NO libgpiod C-library
# dependency to install on the printer's Pi, unlike the `gpiod`/`libgpiod`
# bindings. That matters for a deploy-to-an-appliance daemon: one static
# Rust binary, no apt package to keep in sync. It exposes exactly what the
# watcher needs — a blocking edge-event read (`Request::read_edge_event`,
# no polling) and a single-line value read for the debounce re-read. Chosen
# over the older `gpio-cdev` crate (in maintenance mode, cdev v1 only) and
# over `gpiod` (FFI to the C libgpiod). Linux-only by design and never
# compiled on other platforms — `plrd` itself is Linux-only — and pinned.
gpiocdev = "=0.7.3"

[lints]
workspace = true
