[package]
name = "plrd"
description = "The dead-reckoning daemon: Linux-only runtime for durable WAL I/O and Klipper integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plr-analyzer = { path = "../plr-analyzer" }
plr-gcode = { path = "../plr-gcode" }
plr-klipper = { path = "../plr-klipper" }
plr-reconstruct = { path = "../plr-reconstruct" }
plr-recovery = { path = "../plr-recovery" }
plr-wal = { path = "../plr-wal" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Moonraker WebSocket JSON-RPC client (src/moonraker.rs).
tokio-tungstenite = { workspace = true }
# Stream/Sink traits for the WebSocket (see the workspace table note).
futures-util = { workspace = true }

# Durability syscalls (fdatasync, O_DSYNC) are Linux-only by design and are
# never mocked; keep rustix off non-Linux builds entirely. The `time`
# feature adds CLOCK_MONOTONIC access (`clock_gettime`), needed so record
# timestamps share a clock domain with Klipper's reactor `eventtime`
# (which is `time.monotonic()`); this is a feature of an existing
# workspace dependency, not a new dependency.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["time"] }

[lints]
workspace = true
