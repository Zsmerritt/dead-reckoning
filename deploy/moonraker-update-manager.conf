# Moonraker update_manager registration for plrd (dead-reckoning).
#
# `scripts/install.sh --moonraker` appends this section (with your real
# paths) to <printer_data>/config/moonraker.conf and performs the two
# companion steps listed at the bottom. This file is the canonical
# reference for doing it by hand.
#
# Mechanics, per the official docs
# (https://moonraker.readthedocs.io/en/latest/configuration/, sections
# "[update_manager]" -> "Git Repo Configuration" and "[machine]" ->
# "Allowed Services"):
#
#   * The section name MUST be the systemd unit name ("plrd"):
#     `managed_services` only accepts the section-header name, "klipper",
#     or "moonraker" (svc_choices in Moonraker's
#     components/update_manager/app_deploy.py), and unit names are
#     case-sensitive.
#   * Moonraker runs NO build steps for git_repo entries. `install_script`
#     is deprecated and is only *parsed* for OS package names ("Moonraker
#     will not run this script"); `system_dependencies` installs apt
#     packages only. An update is: git pull -> dependency sync ->
#     restart of `managed_services`.
#   * plrd therefore hooks its rebuild into that service restart: the
#     installer drops /etc/systemd/system/plrd.service.d/50-plrd-refresh.conf
#     with `ExecStartPre=-+... install.sh --refresh`, which rebuilds and
#     swaps the binary only when the repo HEAD changed, and never blocks
#     startup on a failed build (the old binary keeps running).
#   * Channels: the repo now has a semantic-version tag (v0.1.0), so the
#     `stable`/`beta` channels — which deploy from vX.Y.Z tags — are
#     usable; add `channel: stable` under [update_manager plrd] to pin
#     updates to tagged releases. This file keeps the (default) `dev`
#     channel, which tracks `primary_branch`: releases are still sparse,
#     and dev is the mode the rebuild drop-in below was validated with.

[update_manager plrd]
type: git_repo
path: ~/dead-reckoning
#   Adjust if you cloned elsewhere (install.sh --dir). Moonraker requires
#   this to be a git checkout whose `origin` matches the URL below.
origin: https://github.com/Zsmerritt/dead-reckoning.git
primary_branch: main
managed_services: plrd
#   Moonraker restarts the plrd unit after pulling; the systemd drop-in
#   installed by `install.sh --moonraker` turns that restart into
#   "rebuild if changed, then start". Restarting plrd is always safe:
#   it observes Klipper read-only and never touches a running print.
info_tags:
    desc=dead-reckoning power-loss recovery recorder

# Companion steps (both automated by `scripts/install.sh --moonraker`):
#
# 1. Allow-list the service. Moonraker may only manage services listed in
#    <printer_data>/moonraker.asvc (one unit name per line,
#    case-sensitive). Append a line reading exactly:
#
#        plrd
#
# 2. Install the rebuild-on-update drop-in (see mechanics above):
#
#        sudo systemctl edit plrd    # or rerun: install.sh --moonraker
#
#    with the content:
#
#        [Service]
#        ExecStartPre=-+/usr/bin/env bash /home/<you>/dead-reckoning/scripts/install.sh --refresh --dir /home/<you>/dead-reckoning
#        TimeoutStartSec=3600
#
# Then restart Moonraker yourself (sudo systemctl restart moonraker, or
# the web UI) — nothing in this repo ever restarts Moonraker or Klipper.
