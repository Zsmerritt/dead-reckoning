# Starter [plr] section for printer.cfg — the Klipper console plugin
# side of dead-reckoning. Copy the block below into printer.cfg, then
# RESTART Klipper and run PLR_SETUP in the console.
#
# Prerequisite: the plugin must be linked into klippy first
# (scripts/install.sh does this; manually:
#   ln -sfn ~/dead-reckoning/klippy_plugin/plr ~/klipper/klippy/extras/plr).
#
# Every key except probe_method (and accel_chip for adxl_drag) has a
# default, so `[plr]` + `probe_method:` alone is a complete section.
# The full option table lives in klippy_plugin/README.md; the keys are
# a FIXED schema shared with the plrd daemon.
#
# When this section exists, it is the AUTHORITATIVE machine config:
# plrd reads it from the live Klipper config at recover time, and the
# legacy [machine] section of /etc/plrd.conf is ignored.

[plr]
# Which contact oracle recovery uses (REQUIRED choice):
#   tap       — a nozzle-actuated [probe] section (Voron Tap class)
#   load_cell — a [load_cell_probe] section
#   adxl_drag — an accelerometer drag oracle (set accel_chip too);
#               honesty note: its safety BOUNDS are tested, but bench
#               validation of detection quality is still pending (E5)
probe_method: tap

# Accel chip section name for adxl_drag, e.g. "adxl345" or
# "adxl345 bed". Required if (and only if) probe_method is adxl_drag.
#accel_chip: adxl345

# plrd's WAL directory; the plugin reads <wal_dir>/heartbeat.bin as a
# recorder-liveness hint. Match wal_dir in /etc/plrd.conf.
#wal_dir: /var/lib/plrd/wal

# plrd's UNIX control socket (PLR_STATUS / PLR_RECOVER talk to it).
# Must match control_socket in /etc/plrd.conf; the install defaults
# keep the two aligned — change both together or neither.
#control_socket: /var/lib/plrd/plrd.sock

# Recovery probe descent speed, mm/s. Hard band [1.0, 2.0]: the
# post-trigger-travel safety analysis was validated for this band only.
#probe_speed: 1.5

# Extra clearance added around the reconstructed part envelope, mm.
#envelope_margin: 0.5

# Expected unpowered Z sag budget when matching the stop point, mm.
#sag_allowance: 0.2

# --- adxl_drag tunables (ignored by tap / load_cell) -----------------
# Lateral speed of a drag-oracle pass, mm/s; range (0, 100]. Re-run
# PLR_NOISE_TEST after changing it — the noise floor is speed-dependent
# (recovery plans warn when this strays >20% from the calibrated
# noise_floor_speed).
#drag_speed: 20.0

# Z staircase decrement between drag passes, mm; range (0, 0.2]. This
# IS the drag method's overshoot bound: the surface is bracketed to
# within one drag_z_step.
#drag_z_step: 0.05

# 0–100 sensitivity knob (threshold multiplier over the measured noise
# floor). LOW numbers = fewer false triggers (wobbly/noisy machines);
# high numbers catch fainter contact (rigid, quiet machines). Better:
# don't guess — PLR_DRAG_CALIBRATE START=1 sweeps for the most
# sensitive knob that never false-triggers (entirely in clear air) and
# stages it, minus a safety margin, itself.
#drag_sensitivity: 30.0

# Optional temperature covariate for the drag oracle: a klippy sensor
# object (e.g. "temperature_sensor chamber") read at PLR_NOISE_TEST
# time and again at each drag probe. A probe run more than ±15 °C from
# the calibration temperature widens (never narrows) its contact
# threshold, +2%/°C past the band, capped +50%. Unset = covariate
# skipped entirely (nothing is guessed).
#noise_floor_temp_sensor: temperature_sensor chamber

# --- resume-path shaping ---------------------------------------------
# Radius around the probed contact point kept out of the resume entry
# path, mm.
#exclusion_radius: 5.0

# Feedrate cap for the re-entry approach move, mm/min; range (0, 1800].
#entry_feedrate: 1800.0

# Do NOT hand-add self_locking_z, probe_resolution, noise_floor_*,
# a swept drag_sensitivity, or any cal_* key here: the plugin persists
# those itself via SAVE_CONFIG (PLR_SETUP, PLR_PROBE_TEST,
# PLR_NOISE_TEST, PLR_DRAG_CALIBRATE) into the autosave block — and
# every calibration is saved WITH cal_fingerprint_* / cal_*_version
# stamps of the hardware and software it was measured under. A
# hand-edited value would either carry stale stamps (and be treated as
# absent) or no stamps (and be trusted only as "legacy"); measured
# values are the only honest ones.
