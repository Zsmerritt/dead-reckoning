# Example /etc/plrd.conf for a typical Voron 2.4-style moving-bed-Z
# printer with a Moonraker install and four Z steppers.
#
# Format: flat `key = value`, `#` comments — same family as printer.cfg.
# Unknown keys and duplicate keys are HARD ERRORS (typo safety: a
# misspelled durability knob must not silently fall back to a default).
# Every key omitted keeps its built-in default; the canonical list of
# keys and defaults is deploy/plrd.conf.example and docs/install.md.

# Klipper API Unix socket: klippy's `-a` argument. Moonraker installs
# use /home/<user>/printer_data/comms/klippy.sock — check your klipper
# service file if unsure.
klipper_socket = /home/pi/printer_data/comms/klippy.sock

# Where WAL segments, the heartbeat file, and the receive_seq sidecar
# live. MUST be on storage that survives power loss with the printer.
# Recommended: a dedicated partition or USB stick (isolates the 10 Hz
# heartbeat fsync wear from the root SD card; see docs/operations.md).
# The stock systemd unit grants write access to /var/lib/plrd only —
# if you change this, add a systemd override for the new path (see
# examples/plrd.service.override.conf).
wal_dir = /var/lib/plrd/wal

# Voron 2.4: four Z steppers. Committed-step history from these bounds
# the committed-motion boundary t_b during reconstruction — list every
# Z stepper your printer.cfg defines.
z_steppers = stepper_z, stepper_z1, stepper_z2, stepper_z3

# Motion queues to record. toolhead + extruder is right for any
# single-extruder machine (multi-extruder is out of scope in v1).
trapq_queues = toolhead,extruder

# Heartbeat rewrite rate (Hz). Each rewrite is made durable. 10 Hz is
# the designed default: t_a (the "provably still printing at ..." bound)
# is never staler than 100 ms.
heartbeat_hz = 10

# Batch fdatasync interval for motion records (ms). 500 ms matches
# Klipper's own dump batching, so the extra loss window is at most one
# batch on top of an already-batched source. Markers and context
# snapshots are always synced immediately regardless.
batch_sync_ms = 500

# Open the heartbeat file O_DSYNC instead of calling fdatasync after
# every rewrite: identical durability, one syscall per heartbeat
# instead of two. Worth enabling on slow media.
heartbeat_o_dsync = true

# Rotate to a new WAL segment at this size (bytes). 16 MiB default.
# plrd never deletes old segments — retention is yours (operations doc).
segment_rotate_bytes = 16777216

# Bounded queue between the socket reader and the WAL thread. If the
# disk stalls and it fills, motion records are dropped and the gap is
# journaled as a SubscriptionGap marker (honest observation gap).
channel_capacity = 1024

# Moonraker WebSocket endpoint: used for the boot-time pending-recovery
# console announcement and by `plrd recover --execute`. A dry run never
# connects.
moonraker_url = ws://127.0.0.1:7125/websocket

# UNIX control socket served by `plrd run` — the Klipper console
# plugin's PLR_STATUS / PLR_RECOVER commands connect here. Must match
# the `control_socket` key of printer.cfg's [plr] section; the install
# defaults keep the two aligned, so change both together or neither.
# Mode 0666 by default — see deploy/plrd.conf.example and
# crates/plrd/src/ctrlsock.rs for the rationale and the group-based
# tightening story for multi-user hosts.
control_socket = /var/lib/plrd/plrd.sock

# --- LEGACY recovery commissioning ([machine]) -----------------------
# PREFERRED SETUP: add a [plr] section to printer.cfg instead (see
# examples/printer-plr-section.cfg and klippy_plugin/README.md). When
# the running Klipper config has a [plr] section, plrd sources the
# whole machine snapshot from the LIVE config at recover time and this
# entire [machine] section is IGNORED (with an info note); the
# validated_config_hash blessing below is then unnecessary.
#
# Keep this section only for installs that have not adopted the plugin
# — it is deprecated but fully working. Recording needs nothing below.
# `plrd recover` REFUSES to plan until every prerequisite validates;
# all attestations default to false, so a machine is deliberately not
# commissioned until you edit this section. Set each value only after
# verifying the physical fact behind it — see
# docs/install.md#legacy-commissioning-the-machine-section.
[machine]
# [force_move] with enable_force_move: True is present in printer.cfg.
force_move_enabled = true
# Attestation: the Z leadscrews are self-locking (the bed cannot
# back-drive under gravity with the motors off).
z_self_locking_attested = true
# Every Z stepper, as `name` or `name:mcu` (bare names assume
# primary_mcu; a Z stepper on a secondary MCU is refused).
z_steppers = stepper_z, stepper_z1, stepper_z2, stepper_z3
primary_mcu = mcu
# Voron Tap: `tap` ([probe]); use `load_cell` for [load_cell_probe].
probe_kind = tap
# The probe section's configured z_offset, mm.
probe_z_offset = -0.5
# Attestations: the probe's activate/deactivate gcode command no motion
# (empty gcode qualifies; Tap needs none).
probe_activate_gcode_no_move = true
probe_deactivate_gcode_no_move = true
# [stepper_z] position_min (or [printer] minimum_z_position), mm.
z_position_min = -5.0
# printer.cfg location; plrd checksums it at recover time and compares
# against validated_config_hash. On mismatch, recovery refuses and
# prints the newly computed value — re-verify the checklist, then paste
# it here to re-bless.
klipper_config_path = /home/pi/printer_data/config/printer.cfg
#validated_config_hash = crc32c:00000000
# [virtual_sdcard] path.
virtual_sdcard_root = /home/pi/printer_data/gcodes
