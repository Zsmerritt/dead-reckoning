# Example systemd drop-in override for plrd.
#
# Install with:
#   sudo systemctl edit plrd          # opens the override editor
# or place this file at:
#   /etc/systemd/system/plrd.service.d/override.conf
# then:
#   sudo systemctl daemon-reload && sudo systemctl restart plrd
#
# The stock unit (deploy/plrd.service) uses ProtectSystem=strict and
# grants write access only to /var/lib/plrd (StateDirectory=plrd). This
# override moves the WAL to a dedicated USB stick mounted at
# /mnt/plr-wal (see docs/operations.md#disk-sizing-and-write-load for
# why a dedicated medium is recommended) — set `wal_dir` in
# /etc/plrd.conf to /mnt/plr-wal/wal to match.

[Unit]
# Make sure the WAL medium is mounted before the recorder starts, and
# stop the recorder if it disappears. Path unit name = escaped mount
# point (systemd-escape -p /mnt/plr-wal).
RequiresMountsFor=/mnt/plr-wal

[Service]
# Allow writes to the new WAL location through ProtectSystem=strict.
ReadWritePaths=/mnt/plr-wal
