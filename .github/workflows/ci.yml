name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Toolchain policy: rust-toolchain.toml is the single source of truth for
# the Rust version AND components (rustfmt, clippy, llvm-tools-preview).
# Every job runs a bare `rustup toolchain install`, which reads that file,
# so CI always uses exactly the toolchain developers run locally. Bump the
# pin in rust-toolchain.toml only — CI follows automatically. (We avoid
# toolchain-installing actions here because they export RUSTUP_TOOLCHAIN,
# which would silently override the repo pin.)

jobs:
  # Linux is the authority for plrd: lint the FULL workspace here.
  lint:
    name: fmt + clippy (full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (linux, full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  test-windows:
    name: test (windows, default members)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install; rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default members)
        run: cargo test

  # Klippy plugin gates (klippy_plugin/): same pins developers get from
  # scripts/setup-py.sh (klippy_plugin/requirements-dev.txt), and the
  # same gate script the pre-commit hook runs. 3.9 is the dev-tooling
  # floor; 3.12 catches deprecations. The plugin SOURCE additionally
  # stays 3.7 syntax-compatible for klippy — enforced by ruff's
  # target-version in klippy_plugin/pyproject.toml.
  python:
    name: python (klippy_plugin) lint + tests + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: klippy_plugin/requirements-dev.txt
      - name: Install pinned dev deps
        run: python -m pip install -r klippy_plugin/requirements-dev.txt
      - name: ruff check
        run: python -m ruff check klippy_plugin
      - name: ruff format --check
        run: python -m ruff format --check klippy_plugin
      - name: pytest + coverage gate (>=90% lines of plr/)
        run: PYTHON=python sh scripts/coverage-py.sh

  coverage:
    name: coverage gate (>=90% lines, full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # llvm-tools-preview comes from rust-toolchain.toml's components.
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov (fail under 90% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 90
